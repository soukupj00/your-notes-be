# The same pipeline as .gitlab-ci.yml: quality, test, then the image (ADR 0004).
# GitHub mirrors GitLab, so it runs on pushes; the image is built on main and on a v0.x.y tag.
name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}
  # The frontend's published image, which supplies the PWA. Its package must let this
  # repository read it (the package's settings, "Manage Actions access"), or be public.
  FE_IMAGE: ghcr.io/${{ github.repository_owner }}/your-notes-fe:latest

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:ci
      - run: pnpm exec tsc --noEmit
      # Generated files must be committed: a stale OpenAPI document or a schema change
      # without its migration, for either database, fails here.
      - run: pnpm openapi && git diff --exit-code docs/openapi.json
      - run: pnpm db:generate && test -z "$(git status --porcelain drizzle/)" || { git status drizzle/; exit 1; }

  # Fails on a credential anywhere in the history, on any branch.
  # GitLab's Secret Detection template only writes a report, so this job is the gate.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --verbose

  # SeaweedFS runs the BlobStore contract against S3; PostgreSQL runs the Store and Server Backup
  # contracts, the concurrency tests and the CLI tests, which PGlite cannot (ADR 0006).
  test-unit:
    runs-on: ubuntu-latest
    services:
      s3:
        image: chrislusf/seaweedfs:4.48
        env:
          AWS_ACCESS_KEY_ID: yournotes
          AWS_SECRET_ACCESS_KEY: yournotes-ci
        ports:
          - 8333:8333
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: yournotes
          POSTGRES_PASSWORD: yournotes-ci
          POSTGRES_DB: yournotes
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yournotes -d yournotes"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      S3_TEST_ENDPOINT: http://localhost:8333
      S3_TEST_ACCESS_KEY_ID: yournotes
      S3_TEST_SECRET_ACCESS_KEY: yournotes-ci
      # The tests create a database of their own per file on this server.
      PG_TEST_URL: postgres://yournotes:yournotes-ci@localhost:5432/yournotes
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Wait for S3
        run: for _ in $(seq 1 60); do nc -z localhost 8333 && exit 0; sleep 1; done; exit 1
      - run: pnpm test

  # Builds the image on the frontend's, runs it and asks it for /health, and only then
  # publishes: `latest` from main, the git tag from a tag.
  image:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: [quality, secrets, test-unit]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Log in to ghcr.io
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - run: docker build --build-arg "FE_IMAGE=$FE_IMAGE" -t "$IMAGE:${{ github.sha }}" .
      - name: Smoke test
        run: |
          docker run -d --name yournotes -p 3000:3000 "$IMAGE:${{ github.sha }}"
          for _ in $(seq 1 30); do curl -fs http://localhost:3000/health && exit 0; sleep 1; done
          docker logs yournotes; exit 1
      - name: Publish
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then tag="${{ github.ref_name }}"; else tag=latest; fi
          docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:$tag"
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:$tag"
