stages:
  - quality
  - test
  - build
  - publish
  - secret-detection

variables:
  PNPM_STORE_PATH: .pnpm-store
  SECRET_DETECTION_ENABLED: "true"
  IMAGE: $CI_REGISTRY_IMAGE
  FE_IMAGE: gitlab.fit.cvut.cz:5050/soukuj26/ni-dip-fe:latest

# --- Security (keep existing templates) ---
include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

sast:
  stage: quality

secret_detection:
  stage: secret-detection

# --- Shared setup ---
.pnpm-setup: &pnpm-setup
  image: node:24-alpine
  before_script:
    # better-sqlite3 compiles from source when no prebuilt binary matches.
    - apk add --no-cache git python3 make g++
    - corepack enable
    - pnpm config set store-dir "$PNPM_STORE_PATH"
    - pnpm install --frozen-lockfile
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store/
    policy: pull-push
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

# --- Quality ---
lint:
  <<: *pnpm-setup
  stage: quality
  script:
    - pnpm check:ci

typecheck:
  <<: *pnpm-setup
  stage: quality
  script:
    - pnpm exec tsc --noEmit

# Generated files must be committed: a stale OpenAPI document or a schema change
# without its migration, for either database, fails here.
contract:
  <<: *pnpm-setup
  stage: quality
  script:
    - pnpm openapi
    - git diff --exit-code docs/openapi.json
    - pnpm db:generate
    # A new migration is an untracked file, which `git diff` would not see; this covers
    # drizzle/sqlite/ and drizzle/postgres/.
    - test -z "$(git status --porcelain drizzle/)" || { git status drizzle/; exit 1; }

# --- Tests ---
# SeaweedFS, an S3-compatible server, runs the BlobStore contract against S3; PostgreSQL runs
# the Store and Server Backup contracts, the concurrency tests and the CLI tests, which PGlite
# cannot (ADR 0006).
test:unit:
  <<: *pnpm-setup
  stage: test
  services:
    - name: chrislusf/seaweedfs:4.48
      alias: s3
      variables:
        AWS_ACCESS_KEY_ID: yournotes
        AWS_SECRET_ACCESS_KEY: yournotes-ci
        # The image exposes many ports; the job waits for the S3 one.
        HEALTHCHECK_TCP_PORT: "8333"
    - name: postgres:17-alpine
      alias: postgres
      variables:
        POSTGRES_USER: yournotes
        POSTGRES_PASSWORD: yournotes-ci
        POSTGRES_DB: yournotes
  variables:
    S3_TEST_ENDPOINT: http://s3:8333
    S3_TEST_ACCESS_KEY_ID: yournotes
    S3_TEST_SECRET_ACCESS_KEY: yournotes-ci
    # The tests create a database of their own per file on this server.
    PG_TEST_URL: postgres://yournotes:yournotes-ci@postgres:5432/yournotes
  script:
    - pnpm test

# --- Build ---
# Pulls the frontend's published image (FE_IMAGE); ni-dip-be is on that project's
# CI/CD job token allowlist, which is what lets the job token read its registry.
build:image:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  script:
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/Dockerfile"
      --build-arg "FE_IMAGE=$FE_IMAGE"
      --destination "$IMAGE:$CI_COMMIT_SHORT_SHA"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# Runs the image just built and asks it for /health. Needs a runner that allows
# the docker:dind service (privileged).
test:smoke:
  stage: build
  needs: [build:image]
  image: docker:cli
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  allow_failure: true
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker run -d --name yournotes -p 3000:3000 "$IMAGE:$CI_COMMIT_SHORT_SHA"
    - for i in $(seq 1 30); do wget -q -O - http://docker:3000/health && exit 0; sleep 1; done; docker logs yournotes; exit 1
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# --- Publish ---
# Retags the tested image: `latest` from the default branch, the git tag (v0.x.y) from a tag.
.publish: &publish
  stage: publish
  needs: [build:image, test:smoke]
  image:
    name: gcr.io/go-containerregistry/crane:debug
    entrypoint: [""]
  script:
    - crane auth login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - crane tag "$IMAGE:$CI_COMMIT_SHORT_SHA" "$PUBLISH_TAG"

publish:latest:
  <<: *publish
  variables:
    PUBLISH_TAG: latest
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

publish:release:
  <<: *publish
  variables:
    PUBLISH_TAG: $CI_COMMIT_TAG
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
