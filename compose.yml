# YourNotes: the server and Caddy in front of it (ADR 0004).
# Settings come from `.env` next to this file; see `.env.example`.
#
#   docker compose up -d                      # the full stack over HTTPS
#   docker compose --profile local up yournotes-local   # just the server on http://localhost:3000
#   (if `.env` sets COMPOSE_PROFILES, name those too: --profile local --profile postgres up ...,
#   and the same flags for down; never add `local` to COMPOSE_PROFILES, or `up -d` runs two
#   servers on one data volume)
#
# COMPOSE_PROFILES=s3, postgres or postgres,s3 in `.env` adds an S3 bucket or PostgreSQL on this
# machine (docs/setup-backends.md). Set it there: `--profile` on the command line replaces it.
#
# Building the image yourself: see compose.override.yml, which Compose merges in when present.

# Fixed, so the stored data keeps its name even if this folder is renamed or moved.
name: yournotes

x-yournotes: &yournotes
  image: ghcr.io/soukupj00/your-notes-be:${YOURNOTES_VERSION:-latest}
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp
  volumes:
    - yournotes-data:/data
  # Only with the `postgres` profile; without it, Compose skips this.
  depends_on:
    postgres:
      condition: service_healthy
      required: false
  environment: &yournotes-environment
    # Every variable is optional; these are the defaults (src/config.ts).
    PORT: 3000
    PAGE_SIZE: ${PAGE_SIZE:-50}
    TOMBSTONE_DAYS: ${TOMBSTONE_DAYS:-90}
    SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-365}
    BODY_LIMIT_BYTES: ${BODY_LIMIT_BYTES:-5242880}
    BLOB_LIMIT_BYTES: ${BLOB_LIMIT_BYTES:-104857600}
    LOG_LEVEL: ${LOG_LEVEL:-info}
    TRUST_PROXY: ${TRUST_PROXY:-true}
    # Where the first-run Pairing Link points.
    PUBLIC_URL: https://${YOURNOTES_HOST:-localhost}
    # The records in PostgreSQL instead of the data volume (docs/setup-backends.md); empty: unset.
    DATABASE_URL: ${DATABASE_URL:-}
    # Attachments in an S3 bucket instead of the data volume (docs/setup-backends.md); empty: unset.
    BLOB_STORE: ${BLOB_STORE:-disk}
    S3_ENDPOINT: ${S3_ENDPOINT:-}
    S3_REGION: ${S3_REGION:-us-east-1}
    S3_BUCKET: ${S3_BUCKET:-}
    # No colon: `S3_PREFIX=` in .env stays empty, which means the bucket root.
    S3_PREFIX: ${S3_PREFIX-yournotes/}
    S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
    S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}

services:
  # No published port: only Caddy reaches it.
  yournotes:
    <<: *yournotes

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - yournotes
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      YOURNOTES_HOST: ${YOURNOTES_HOST:-localhost}
      YOURNOTES_TLS: ${YOURNOTES_TLS:-auto}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      # Tailscale mode: let Caddy fetch the tailnet certificate from the host's tailscaled.
      # Uncomment, set YOURNOTES_HOST to the machine's *.ts.net name and YOURNOTES_TLS=auto.
      # - /var/run/tailscale/tailscaled.sock:/var/run/tailscale/tailscaled.sock

  # The server alone on http://localhost:3000, for trying it out; never exposed with Caddy.
  yournotes-local:
    <<: *yournotes
    profiles: [local]
    # Merged, not replaced, so the settings in `.env` apply here too.
    environment:
      <<: *yournotes-environment
      TRUST_PROXY: "false"
      PUBLIC_URL: http://localhost:3000
    ports:
      - "127.0.0.1:3000:3000"

  # SeaweedFS, an S3-compatible bucket on this machine, for trying BLOB_STORE=s3. In `.env`:
  # COMPOSE_PROFILES=s3, BLOB_STORE=s3, S3_ENDPOINT=http://s3:8333, S3_BUCKET=yournotes,
  # S3_FORCE_PATH_STYLE=true, and the two S3 keys. SeaweedFS takes the keys as its own login and
  # makes the bucket once it is up; the server waits for it.
  s3:
    image: chrislusf/seaweedfs:4.48
    profiles: [s3]
    restart: unless-stopped
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-yournotes}
    volumes:
      - s3-data:/data

  # PostgreSQL on this machine, for the records. In `.env`: POSTGRES_PASSWORD, and
  # DATABASE_URL=postgres://yournotes:<that password>@postgres:5432/yournotes.
  postgres:
    image: postgres:17-alpine
    profiles: [postgres]
    restart: unless-stopped
    environment:
      POSTGRES_USER: yournotes
      POSTGRES_DB: yournotes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yournotes -d yournotes"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  yournotes-data:
  caddy-data:
  caddy-config:
  s3-data:
  postgres-data:
